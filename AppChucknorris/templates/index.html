<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuck Norris Jokes</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script>
        async function fetchJoke() {
            const jokeElement = document.getElementById("joke");
            const category = document.getElementById("category").value;
            const url = new URL("{% url 'random_joke' %}", window.location.origin);
            if (category) {
                url.searchParams.set("category", category);
            }

            jokeElement.innerText = "Loading joke...";
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (!response.ok || typeof data.joke !== "string") {
                    throw new Error(data.error || "Failed to retrieve joke");
                }
                jokeElement.innerText = data.joke;
            } catch (error) {
                jokeElement.innerText = "Could not retrieve a joke right now. Please try again.";
            }
        }

        async function loadCategories() {
            const categorySelect = document.getElementById("category");
            try {
                const response = await fetch("https://api.chucknorris.io/jokes/categories");
                if (!response.ok) {
                    throw new Error("Failed to load categories");
                }
                const categories = await response.json();
                categories.forEach(function (category) {
                    if ([...categorySelect.options].some(option => option.value === category)) {
                        return;
                    }
                    const option = document.createElement("option");
                    option.value = category;
                    option.text = category.charAt(0).toUpperCase() + category.slice(1);
                    categorySelect.add(option);
                });
            } catch (error) {
                // Keep the built-in categories available if the API is unavailable.
            }
        }

        async function saveJoke() {
            const joke = document.getElementById("joke").innerText.trim();
            if (!joke || joke === "Loading joke..." || joke.startsWith("Could not retrieve")) {
                alert("Load a joke before saving it.");
                return;
            }
            const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;
            try {
                const response = await fetch("{% url 'add_joke' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify({ text: joke })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || "Failed to save joke");
                }
                alert("Joke saved successfully!");
            } catch (error) {
                alert(error.message || "Failed to save joke");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadCategories();
            fetchJoke();
        });
    </script>
</head>

<body>
    <label for="category">Select Category:</label>
    <select id="category">
        <option value="">Random</option>
        <option value="animal">Animal</option>
        <option value="career">Career</option>
        <option value="celebrity">Celebrity</option>
        <option value="dev">Dev</option>
        <option value="explicit">Explicit</option>
        <option value="fashion">Fashion</option>
        <option value="food">Food</option>
        <option value="history">History</option>
        <option value="money">Money</option>
        <option value="movie">Movie</option>
        <option value="music">Music</option>
        <option value="political">Political</option>
        <option value="religion">Religion</option>
        <option value="science">Science</option>
        <option value="sport">Sport</option>
        <option value="travel">Travel</option>
    </select>
    <h1>Chuck Norris Jokes</h1>
    <p id="joke" aria-live="polite"></p>
    <button id="get-joke-btn" onclick="fetchJoke()">Get Joke</button>
    <button onclick="saveJoke()">Save joke</button>
    {% csrf_token %}
</body>

</html>
